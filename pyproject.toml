[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cas-reference-product"
version = "0.1.0"
description = "Public reference application for CAS and Microsoft Foundry Next Gen Agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "azure-ai-projects>=1.0.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "fastapi>=0.115.0",
  "opentelemetry-api>=1.29.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cas_reference_product"]

[tool.pytest.ini_options]
addopts = "--cov=cas_reference_product --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cas_reference_product"]
